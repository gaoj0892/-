version: 2
updates:
  # npm 依赖：每周一检查，分组以减少 PR 噪音
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # 这四者的大版本会改变构建形态或产物体积，必须人工评估（见 ADR 0001）
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: echarts
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
      include: scope

  # GitHub Actions：每月检查，最多 2 个 PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci(deps)'
      include: scope
