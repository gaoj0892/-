name: 功能建议
description: 提出一个不改变统计口径或可明确论证口径变更的改进建议
title: '[feat] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        本仓库只做「历史数据的统计展示 + 随机选号辅助」，不提供任何效果承诺。
        不接受「如何提高中奖概率」「推荐一组号码」一类请求 —— 单注头奖概率恒为 1/21,425,712，无法被任何方法改变。

  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 现在遇到什么不便？你希望解决什么问题？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 尽量具体（放在哪个页签、交互如何、边界情况怎么处理）
    validations:
      required: true

  - type: dropdown
    id: stats-impact
    attributes:
      label: 是否影响统计口径
      description: 只要改变已有统计量的计算方式就算「是」
      options:
        - 不影响（纯 UI / 性能 / 文档）
        - 影响（新增统计量）
        - 影响（修改已有统计量或选号算法）
    validations:
      required: true

  - type: textarea
    id: stats-detail
    attributes:
      label: 若影响统计口径，请说明
      description: 现口径是什么、新口径是什么、为什么更合理、准备补哪些用例（85 个基线用例不得减少）
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 交付约束自查
      options:
        - label: 该方案不要求引入后端 / 数据库 / 账号体系
        - label: 该方案不需要代码分割（会破坏 file:// 双击运行，见 ADR 0001）
        - label: 该方案不涉及任何开奖结果的断言或效果承诺

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过但放弃的做法及原因
    validations:
      required: false
